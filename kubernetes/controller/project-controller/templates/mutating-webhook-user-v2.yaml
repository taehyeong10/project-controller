apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: userrelationship-v2.project-controller.project.aipub.ten1010.io
webhooks:
  - name: userrelationship-v2.project-controller.project.aipub.ten1010.io
    admissionReviewVersions: [ "v1" ]
    clientConfig:
      caBundle: <CA_BUNDLE>
      service:
        namespace: project-controller
        name: project-controller
        path: /api/v1/userrelationship/mutate
        port: 8080
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kube-flannel
            - aipub
            - coaster
            - harbor
            - ingress-nginx
            - keycloak
            - linkerd
            - metallb
            - project-controller
            - aipub-promstack
            - trident
            - aipub-efk
    objectSelector: { }
    reinvocationPolicy: IfNeeded
    # 소유권 대상 타입(OwnershipPolicy.OWNED_TARGETS)의 CREATE 를 인터셉트해 소유자 레이블을 찍는다.
    # events/endpoints 는 시스템 컴포넌트가 고빈도로 생성하므로 인터셉트하지 않는다
    # (레이블이 없는 오브젝트는 소유권 추적 대상이 아님).
    # OwnershipPolicy 목록을 바꿀 때는 이 rules 도 함께 확인할 것.
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "pods", "replicationcontrollers", "services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts", "limitranges" ]
        scope: "Namespaced"
      - apiGroups: [ "networking.k8s.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "ingresses" ]
        scope: "Namespaced"
      - apiGroups: [ "autoscaling" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "horizontalpodautoscalers" ]
        scope: "Namespaced"
      - apiGroups: [ "policy" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "poddisruptionbudgets" ]
        scope: "Namespaced"
      - apiGroups: [ "batch" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      - apiGroups: [ "apps" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      - apiGroups: [ "aipub.ten1010.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
    sideEffects: None
    timeoutSeconds: 10
