apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: userrelationship-v2.project-controller.project.aipub.ten1010.io
webhooks:
  - name: userrelationship-v2.project-controller.project.aipub.ten1010.io
    admissionReviewVersions: [ "v1" ]
    clientConfig:
      caBundle: <CA_BUNDLE>
      service:
        namespace: project-controller
        name: project-controller
        path: /api/v1/userrelationship/mutate
        port: 8080
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kube-flannel
            - aipub
            - coaster
            - harbor
            - ingress-nginx
            - keycloak
            - linkerd
            - metallb
            - project-controller
            - aipub-promstack
            - trident
            - aipub-efk
    objectSelector: { }
    reinvocationPolicy: IfNeeded
    # 소유권 대상 타입(OwnershipPolicy.OWNED_TARGETS)의 CREATE 를 인터셉트해 소유자 레이블을 찍는다.
    # 멤버가 직접 만든 오브젝트가 레이블 없이 남으면 본인도 수정/삭제할 수 없게 되므로
    # 멤버 Role 이 create 를 허용하는 타입(events/endpoints 포함)은 모두 인터셉트한다.
    # 시스템 컴포넌트가 만드는 오브젝트는 비멤버라 무변경 통과된다.
    # OwnershipPolicy 목록을 바꿀 때는 이 rules 도 함께 확인할 것.
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "pods", "replicationcontrollers", "services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts", "limitranges", "endpoints", "events" ]
        scope: "Namespaced"
      # Event 는 core("") 와 events.k8s.io 두 API 로 생성될 수 있으므로 둘 다 인터셉트한다
      - apiGroups: [ "events.k8s.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "events" ]
        scope: "Namespaced"
      - apiGroups: [ "networking.k8s.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "ingresses" ]
        scope: "Namespaced"
      - apiGroups: [ "autoscaling" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "horizontalpodautoscalers" ]
        scope: "Namespaced"
      - apiGroups: [ "policy" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "poddisruptionbudgets" ]
        scope: "Namespaced"
      - apiGroups: [ "batch" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      - apiGroups: [ "apps" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      - apiGroups: [ "aipub.ten1010.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
    sideEffects: None
    timeoutSeconds: 10
